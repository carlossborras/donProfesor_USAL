[project]
name = "hack4edu"
version = "0.1.0"
description = "DONPROFESOR — Plataforma de Analítica Educativa Acompañada (#Hack4Edu)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "joblib>=1.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "lightgbm>=4.3.0",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.2",
    "pyjwt>=2.15.1",
    "pytest>=9.2.0",
    "python-multipart>=0.0.33",
    "scikit-learn==1.6.1",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
